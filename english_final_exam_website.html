    // =========================================================================
    // STATE MANAGEMENT & PERSISTENCE
    // =========================================================================
    const STORAGE_KEY = 'english_final_exam_progress_v1';

    let state = {
      view: 'landing', // 'landing' | 'dashboard' | 'quiz' | 'open' | 'summary'
      activeTopicId: null,
      quizQuestions: [], // Array of { topicId, topicTitle, qIndex, ...questionObj }
      currentIndex: 0,
      selectedOption: null, // Index 0..3 for MCQ
      isAnswered: false,
      sessionResults: [], // { q, userChoice, correctIndices, isCorrect, explanation }
      openRevealed: false,
      userNotes: '',
      showCheatSheet: false,
      progress: loadProgress() // { [topicId]: { [qIndex]: boolean (true if correct/mastered) } }
    };

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
      } catch (e) {
        // Ignore storage errors
      }
      updateHeaderStats();
    }

    function recordAnswer(topicId, qIndex, isCorrect) {
      if (!state.progress[topicId]) {
        state.progress[topicId] = {};
      }
      state.progress[topicId][qIndex] = isCorrect;
      saveProgress();
    }

    function getTopicStats(topic) {
      const topicProg = state.progress[topic.id] || {};
      const total = topic.questions.length;
      let correct = 0;
      let attempted = 0;
      for (let i = 0; i < total; i++) {
        if (topicProg[i] !== undefined) {
          attempted++;
          if (topicProg[i] === true) correct++;
        }
      }
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      return { total, correct, attempted, pct };
    }

    function getGlobalStats() {
      let total = 0;
      let correct = 0;
      EXAM_TOPICS.forEach(t => {
        const s = getTopicStats(t);
        total += s.total;
        correct += s.correct;
      });
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      return { total, correct, pct };
    }

    function updateHeaderStats() {
      const g = getGlobalStats();
      const progEl = document.getElementById('nav-progress-text');
      const countEl = document.getElementById('nav-solved-count');
      if (progEl) progEl.textContent = `${g.pct}%`;
      if (countEl) countEl.textContent = `${g.correct}/${g.total}`;
    }

    // =========================================================================
    // NAVIGATION & ACTIONS
    // =========================================================================
    function navigateTo(view) {
      state.view = view;
      const topNav = document.getElementById('top-nav');
      if (view === 'landing') {
        topNav.classList.add('hidden');
      } else {
        topNav.classList.remove('hidden');
      }
      updateHeaderStats();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startTopic(topicId) {
      const topic = EXAM_TOPICS.find(t => t.id === topicId);
      if (!topic) return;

      state.activeTopicId = topicId;
      state.currentIndex = 0;
      state.selectedOption = null;
      state.isAnswered = false;
      state.sessionResults = [];
      state.openRevealed = false;
      state.userNotes = '';
      state.showCheatSheet = false;

      if (topic.type === 'open') {
        state.quizQuestions = topic.questions.map((q, idx) => ({
          ...q,
          topicId: topic.id,
          topicTitle: topic.title,
          qIndex: idx
        }));
        navigateTo('open');
      } else {
        state.quizQuestions = topic.questions.map((q, idx) => ({
          ...q,
          topicId: topic.id,
          topicTitle: topic.title,
          qIndex: idx
        }));
        navigateTo('quiz');
      }
    }

    function startAllMcqs() {
      const all = [];
      EXAM_TOPICS.filter(t => t.type === 'mcq').forEach(topic => {
        topic.questions.forEach((q, idx) => {
          all.push({
            ...q,
            topicId: topic.id,
            topicTitle: topic.title,
            qIndex: idx
          });
        });
      });

      state.activeTopicId = 'all_mcqs';
      state.quizQuestions = all;
      state.currentIndex = 0;
      state.selectedOption = null;
      state.isAnswered = false;
      state.sessionResults = [];
      state.showCheatSheet = false;
      navigateTo('quiz');
    }

    function selectMcqOption(optionIdx) {
      if (state.isAnswered) return;
      const currentQ = state.quizQuestions[state.currentIndex];
      if (!currentQ || optionIdx < 0 || optionIdx >= currentQ.options.length) return;

      state.selectedOption = optionIdx;
      state.isAnswered = true;

      const isCorrect = currentQ.correct.includes(optionIdx);
      recordAnswer(currentQ.topicId, currentQ.qIndex, isCorrect);

      state.sessionResults.push({
        q: currentQ.q,
        topicTitle: currentQ.topicTitle,
        userChoice: currentQ.options[optionIdx],
        correctChoices: currentQ.correct.map(i => `${['A', 'B', 'C', 'D'][i]}) ${currentQ.options[i]}`),
        isCorrect,
        explanation: currentQ.explanation
      });

      render();
    }

    function nextQuestion() {
      if (state.view === 'quiz') {
        if (!state.isAnswered) return;
        if (state.currentIndex + 1 < state.quizQuestions.length) {
          state.currentIndex++;
          state.selectedOption = null;
          state.isAnswered = false;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          navigateTo('summary');
        }
      } else if (state.view === 'open') {
        if (state.currentIndex + 1 < state.quizQuestions.length) {
          state.currentIndex++;
          state.openRevealed = false;
          state.userNotes = '';
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          navigateTo('dashboard');
        }
      }
    }

    function prevOpenQuestion() {
      if (state.view === 'open' && state.currentIndex > 0) {
        state.currentIndex--;
        state.openRevealed = false;
        state.userNotes = '';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function revealOpenAnswer() {
      state.openRevealed = true;
      render();
    }

    function gradeOpenQuestion(mastered) {
      const currentQ = state.quizQuestions[state.currentIndex];
      if (!currentQ) return;
      recordAnswer(currentQ.topicId, currentQ.qIndex, mastered);
      nextQuestion();
    }

    function toggleCheatSheet() {
      state.showCheatSheet = !state.showCheatSheet;
      render();
    }

    function confirmResetProgress() {
      showModal(
        'Reset All Exam Progress?',
        'This will clear your saved scores and completion bars across all 10 topics so you can practice from scratch.',
        () => {
          state.progress = {};
          saveProgress();
          render();
        }
      );
    }

    function showModal(title, message, onConfirm) {
      const modal = document.getElementById('custom-modal');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      modal.classList.remove('hidden');

      const cancelBtn = document.getElementById('modal-cancel');
      const confirmBtn = document.getElementById('modal-confirm');

      const cleanup = () => {
        modal.classList.add('hidden');
        cancelBtn.onclick = null;
        confirmBtn.onclick = null;
      };

      cancelBtn.onclick = cleanup;
      confirmBtn.onclick = () => {
        cleanup();
        onConfirm();
      };
    }

    // =========================================================================
    // KEYBOARD SHORTCUTS LISTENER (1, 2, 3, 4 -> A, B, C, D | Enter/Arrow -> Next)
    // =========================================================================
    document.addEventListener('keydown', (e) => {
      // Ignore shortcuts if typing inside textarea or input
      const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (tag === 'textarea' || tag === 'input') {
        if (e.key === 'Escape') {
          document.activeElement.blur();
        }
        return;
      }

      // Close modal on Escape if open
      const modal = document.getElementById('custom-modal');
      if (modal && !modal.classList.contains('hidden')) {
        if (e.key === 'Escape') modal.classList.add('hidden');
        return;
      }

      if (state.view === 'landing') {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          navigateTo('dashboard');
        }
        return;
      }

      if (state.view === 'quiz') {
        if (['1', '2', '3', '4'].includes(e.key)) {
          e.preventDefault();
          selectMcqOption(parseInt(e.key, 10) - 1);
        } else if ((e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ') && state.isAnswered) {
          e.preventDefault();
          nextQuestion();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          navigateTo('dashboard');
        }
        return;
      }

      if (state.view === 'open') {
        if (!state.openRevealed && (e.key === ' ' || e.key === 'Enter')) {
          e.preventDefault();
          revealOpenAnswer();
        } else if (state.openRevealed && e.key === '1') {
          e.preventDefault();
          gradeOpenQuestion(true);
        } else if (state.openRevealed && e.key === '2') {
          e.preventDefault();
          gradeOpenQuestion(false);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          nextQuestion();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevOpenQuestion();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          navigateTo('dashboard');
        }
        return;
      }

      if (state.view === 'summary') {
        if (e.key === 'Enter' || e.key === 'Escape') {
          e.preventDefault();
          navigateTo('dashboard');
        }
      }
    });

    // =========================================================================
    // VIEW RENDERERS
    // =========================================================================
    function render() {
      const app = document.getElementById('app');
      if (state.view === 'landing') {
        app.innerHTML = renderLandingView();

      const qObj = state.quizQuestions[state.currentIndex];
      const total = state.quizQuestions.length;

      const letters = ['A', 'B', 'C', 'D'];
      const activeTopic = EXAM_TOPICS.find(t => t.id === qObj.topicId);

      const optionsHtml = qObj.options.map((optText, idx) => {
        const keyNum = idx + 1;
        const letter = letters[idx];
        const isCorrectOption = qObj.correct.includes(idx);
        const isSelected = state.selectedOption === idx;

        let cardClass = 'bg-slate-900 border-slate-800 hover:border-indigo-500/60 hover:bg-slate-800/80 text-slate-100';
        let badgeClass = 'bg-slate-800 text-indigo-300 border-slate-700';
        let statusIcon = '';

        if (state.isAnswered) {
          if (isCorrectOption) {
            cardClass = 'bg-emerald-950/60 border-emerald-500 text-emerald-100 shadow-lg shadow-emerald-950/40';
            badgeClass = 'bg-emerald-600 text-white border-emerald-500';
            statusIcon = `<span class="ml-auto text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1">✓ Correct</span>`;
          } else if (isSelected && !isCorrectOption) {
            cardClass = 'bg-rose-950/60 border-rose-500 text-rose-100';
            badgeClass = 'bg-rose-600 text-white border-rose-500';
            statusIcon = `<span class="ml-auto text-xs font-bold uppercase tracking-wider text-rose-400 flex items-center gap-1">✕ Incorrect</span>`;
          } else {
            cardClass = 'bg-slate-900/40 border-slate-800/60 text-slate-500 opacity-60';
            badgeClass = 'bg-slate-800/60 text-slate-500 border-slate-800';
          }
        }

        return `
          <button
            onclick="selectMcqOption(${idx})"
            ${state.isAnswered ? 'disabled' : ''}
            class="w-full text-left p-4 sm:p-5 rounded-2xl border-2 transition-all flex items-center gap-4 ${cardClass} ${state.isAnswered ? 'cursor-default' : 'cursor-pointer active:scale-[0.99]'}"

            <div class="flex items-center gap-2 shrink-0">
              <kbd class="keycap font-mono text-xs font-bold px-2.5 py-1.5 rounded-lg border ${badgeClass}">

              <span class="font-extrabold text-sm sm:text-base text-slate-300">${letter})</span>
            </div>
            <span class="text-sm sm:text-base font-medium leading-snug">${escapeHtml(optText)}</span>

      }).join('');

      const isUserRight = state.isAnswered && qObj.correct.includes(state.selectedOption);

      return `

            <!-- Grammar Cheat Sheet Toggle (For Grammar Master Revision Pack) -->
            ${activeTopic && activeTopic.hasCheatSheet ? `
              <div class="mb-6">
                <button onclick="toggleCheatSheet()" class="w-full py-2.5 px-4 rounded-xl bg-teal-950/50 hover:bg-teal-900/50 border border-teal-700/50 text-teal-300 text-xs sm:text-sm font-semibold flex items-center justify-between transition cursor-pointer">

            <!-- Question Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl mb-6">
              <h2 class="text-lg sm:text-2xl font-bold text-white leading-relaxed whitespace-pre-line">${escapeHtml(qObj.q)}</h2>
            </div>

            <!-- Answer Options (1, 2, 3, 4) -->
            <div class="space-y-3 mb-6">
              ${optionsHtml}

            <!-- Instant Explanation Banner -->
            ${state.isAnswered ? `
              <div class="rounded-2xl p-5 border ${isUserRight ? 'bg-emerald-950/40 border-emerald-500/40' : 'bg-rose-950/40 border-rose-500/40'} mb-6 fade-in">
                <div class="flex items-center gap-2 font-bold text-sm mb-1.5 ${isUserRight ? 'text-emerald-400' : 'text-rose-400'}">

            </button>
          </div>
        </div>
      `;
    }

    // Grammar Rules Cheat Sheet Component (From REVISION EXAM.pdf Part 1)
    function renderGrammarCheatSheet() {
      return `
        <div class="mt-3 bg-slate-900 border border-teal-800/50 rounded-2xl p-5 text-xs sm:text-sm text-slate-300 space-y-3 fade-in">

              <p class="text-slate-400">Example: <em>Swimming</em> improves stamina. (Test: Replace with "the activity").</p>
            </div>
            <div class="bg-slate-950/70 p-3.5 rounded-xl border border-slate-800">
              <strong class="text-teal-300 block mb-1">2. Four Common Gerund Jobs</strong>
              <p class="text-slate-400">Subject (<em>Reading</em> helps), Direct Object (enjoys <em>reading</em>), Predicate Nominative (hobby is <em>reading</em>), Object of Preposition (good at <em>reading</em>).</p>
            </div>
            <div class="bg-slate-950/70 p-3.5 rounded-xl border border-slate-800">
              <strong class="text-teal-300 block mb-1">3. Participle (Verb form used as ADJECTIVE)</strong>

            </div>
          </div>
        </div>
      `;
    }

                    </button>
                    <button onclick="gradeOpenQuestion(false)" class="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition cursor-pointer">
                      <kbd class="font-mono text-xs bg-black/25 px-1.5 py-0.5 rounded">2</kbd>
                      <span>Review Again</span>
                    </button>
                  </div>
                </div>
              </div>
            `}
          </div>

          <!-- Bottom Navigation -->
          <div class="flex items-center justify-between pt-4 border-t border-slate-800/80 mt-6">
            <button
              onclick="prevOpenQuestion()"
              ${state.currentIndex === 0 ? 'disabled' : ''}
              class="px-4 py-2.5 rounded-xl font-semibold text-sm border transition ${state.currentIndex === 0 ? 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200 cursor-pointer'}"
            >
              ← Previous
            </button>
            <button
              onclick="nextQuestion()"
              class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-sm transition cursor-pointer"
            >
              ${state.currentIndex + 1 === total ? 'Finish Study →' : 'Skip / Next →'}
            </button>
          </div>
        </div>
      `;
    }

    // 5. END-OF-TOPIC SUMMARY VIEW
    function renderSummaryView() {
      const total = state.sessionResults.length;
      const correctCount = state.sessionResults.filter(r => r.isCorrect).length;
      const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      const missed = state.sessionResults.filter(r => !r.isCorrect);

      return `
        <div class="max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 fade-in">
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/15 border border-indigo-500/30 text-indigo-400 text-2xl font-extrabold mb-4">
              ${accuracy}%
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Section Complete!</h2>
            <p class="text-slate-400 text-sm sm:text-base mb-6">
              You scored <strong class="text-white">${correctCount} out of ${total}</strong> on this session.
            </p>

            <div class="flex flex-wrap items-center justify-center gap-3">
              <button onclick="navigateTo('dashboard')" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/20 transition cursor-pointer">
                Back to Dashboard
              </button>
              ${state.activeTopicId && state.activeTopicId !== 'all_mcqs' ? `
                <button onclick="startTopic('${state.activeTopicId}')" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm border border-slate-700 transition cursor-pointer">
                  Retry Topic
                </button>
              ` : ''}
            </div>
          </div>

          ${missed.length > 0 ? `
            <div class="space-y-4">
              <h3 class="text-lg font-bold text-rose-400">Questions to Review (${missed.length})</h3>
              ${missed.map(m => `
                <div class="bg-slate-900 border border-rose-500/30 rounded-2xl p-5">
                  <div class="text-xs font-semibold text-slate-400 mb-1">${escapeHtml(m.topicTitle)}</div>
                  <div class="font-bold text-white text-sm sm:text-base mb-3 whitespace-pre-line">${escapeHtml(m.q)}</div>
                  <div class="text-xs sm:text-sm text-rose-300 mb-1">Your answer: ${escapeHtml(m.userChoice)}</div>
                  <div class="text-xs sm:text-sm text-emerald-400 font-semibold mb-2">Correct answer: ${escapeHtml(m.correctChoices.join(' OR '))}</div>
                  <div class="text-xs text-slate-300 bg-slate-950/70 p-3 rounded-xl border border-slate-800">${escapeHtml(m.explanation)}</div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="bg-emerald-950/30 border border-emerald-500/30 rounded-2xl p-6 text-center text-emerald-300 font-semibold text-sm">
              Perfect score! You answered every single question in this section accurately.
            </div>
          `}
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initialize App on Window Load
    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
